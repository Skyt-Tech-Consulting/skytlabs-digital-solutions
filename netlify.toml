# Netlify build settings. The Nitro "netlify" preset is selected automatically during
# Netlify builds (see vite.config.ts): static files go to dist/, and the server
# (pages, admin, API, sitemap, media) runs as one Netlify Function.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
